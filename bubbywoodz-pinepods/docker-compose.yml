version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bubbywoodz-pinepods_server_1
      APP_PORT: 8040
      PROXY_AUTH_ADD: "false"

  server:
    image: docker.io/madeofpendletonwool/pinepods:0.9.0@sha256:ebc258bb0c62cdb69e5fb726b247c885dac19b50d06fed68fa8d37197b88ace4
    container_name: bubbywoodz-pinepods_server_1
    ports:
      - "8040:8040"
    environment:
      SEARCH_API_URL: "https://search.pinepods.online/api/search"
      PEOPLE_API_URL: "https://people.pinepods.online"
      HOSTNAME: "http://umbrel.local:8040"
      DB_TYPE: postgresql
      DB_HOST: bubbywoodz-pinepods_postgres_1
      DB_PORT: 5432
      DB_USER: pinepods
      DB_PASSWORD: "pinepods"
      DB_NAME: pinepods_database
      VALKEY_HOST: bubbywoodz-pinepods_valkey_1
      VALKEY_PORT: 6379
      DEBUG_MODE: "false"
      PUID: "1000"
      PGID: "1000"
      TZ: "America/Los_Angeles"
      DEFAULT_LANGUAGE: "en"
    volumes:
      - ${APP_DATA_DIR}/data/downloads:/opt/pinepods/downloads
      - ${APP_DATA_DIR}/data/backups:/opt/pinepods/backups
      - /home/umbrel/umbrel/external/T7/Podcasts:/opt/pinepods/local-media:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - postgres
      - valkey
    restart: on-failure

  postgres:
    image: docker.io/library/postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: bubbywoodz-pinepods_postgres_1
    environment:
      POSTGRES_DB: pinepods_database
      POSTGRES_USER: pinepods
      POSTGRES_PASSWORD: "pinepods"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    restart: on-failure

  valkey:
    image: docker.io/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    container_name: bubbywoodz-pinepods_valkey_1
    user: "1000:1000"
    volumes:
      - ${APP_DATA_DIR}/data/valkey:/data
    restart: on-failure
