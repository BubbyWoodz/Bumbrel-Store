version: "3.9"
services:
  app_proxy:
    environment:
      APP_HOST: bubbywoodz-reverb_server_1
      APP_PORT: 1971
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/bubbywoodz/swingmusic:latest@sha256:bb2fff2d3c47273487956c3d09574141b639937cb83378ffdad1a1f0ec369c27
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - SWINGMUSIC_PORT=1971
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/music:/music:rw
