version: "3.9"
services:
  app_proxy:
    environment:
      APP_HOST: bubbywoodz-reverb_server_1
      APP_PORT: 1971
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/bubbywoodz/swingmusic:latest@sha256:78f43f68ad0abbad14d623952992460b81987bf8ea39d93a1bafeb1517433f1e
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - SWINGMUSIC_PORT=1971
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/music:/music:rw
