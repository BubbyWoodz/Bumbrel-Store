
services:
  app_proxy:
    environment:
      APP_HOST: bubbywoodz-mem0_dashboard_1
      APP_PORT: 3000

  postgres:
    container_name: bubbywoodz-mem0_postgres_1
    image: pgvector/pgvector:pg17
    restart: on-failure
    shm_size: 128mb
    environment:
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: mem0
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
      - ${APP_DATA_DIR}/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: bubbywoodz-mem0_api_1
    image: ghcr.io/bubbywoodz/mem0-api-server:latest
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8000"
    # Upstream image does not run migrations on start (only the dev compose
    # does), so run them here before launching uvicorn.
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_COLLECTION_NAME: memories
      JWT_SECRET: ${APP_SEED}
      ADMIN_API_KEY: ${APP_SEED}
      AUTH_DISABLED: "false"
      MEM0_TELEMETRY: "false"
      DASHBOARD_URL: http://umbrel.local:8093
      APP_DB_NAME: mem0_app
      OPENAI_API_KEY: ""
      # Route the bundled OpenAI provider at local Ollama (OpenAI-compatible).
      OPENAI_BASE_URL: http://ollama_ollama_1:11434/v1
      MEM0_DEFAULT_LLM_MODEL: llama3.1:8b
      MEM0_DEFAULT_EMBEDDER_MODEL: nomic-embed-text
      HISTORY_DB_PATH: /app/history/history.db
    volumes:
      - ${APP_DATA_DIR}/data/history:/app/history

  dashboard:
    container_name: bubbywoodz-mem0_dashboard_1
    image: ghcr.io/bubbywoodz/mem0-dashboard:latest
    restart: on-failure
    depends_on:
      - api
    ports:
      - "8093:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://umbrel.local:8888
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_INSTANCE_NAME: Mem0
