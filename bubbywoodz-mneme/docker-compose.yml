version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bubbywoodz-mneme_web_1
      APP_PORT: 80

  postgres:
    container_name: bubbywoodz-mneme_postgres_1
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: on-failure
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: journal
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journal"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_RPC_SECRET: ${APP_SEED}
      GARAGE_DEFAULT_ACCESS_KEY: "GK${APP_SEED}"
      GARAGE_DEFAULT_SECRET_KEY: ${APP_SEED}
      GARAGE_DEFAULT_BUCKET: "journal-media"
    volumes:
      - ${APP_DATA_DIR}/garage.toml:/etc/garage.toml:ro
      - ${APP_DATA_DIR}/data/garage-meta:/var/lib/garage/meta
      - ${APP_DATA_DIR}/data/garage-data:/var/lib/garage/data

  server:
    container_name: bubbywoodz-mneme_server_1
    image: ghcr.io/mneme-blog/mneme-server:v0.5.1@sha256:6e36d34db7ee973228d509528f047a9f0709377ed40389cf215c0fee0f758fec
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://journal:${APP_SEED}@postgres:5432/journal?sslmode=disable"
      # Media storage: Garage (S3-compatible, run by the Deuxfleurs non-profit;
      # no telemetry, privacy-aligned). Bucket auto-created on first boot.
      S3_ENDPOINT: "http://garage:3900"
      S3_ACCESS_KEY: "GK${APP_SEED}"
      S3_SECRET_KEY: ${APP_SEED}
      S3_BUCKET: "journal-media"
      LISTEN_ADDR: ":8080"
      CORS_ORIGINS: ""
      # Admin surface disabled (empty token => every /admin path 404s).
      # Not needed: operator approval is off, vaults are trust-on-first-use.
      ADMIN_TOKEN: ""
      REQUIRE_APPROVAL: "false"
      BACKUP_DIR: /backups
      BACKUP_INTERVAL: 24h
      BACKUP_KEEP: "14"
      BACKUP_HOST_DIR: /mnt/host-backups
      UPDATE_CHECK: "on"
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - ${APP_DATA_DIR}/data/backups:/backups
      - ${APP_DATA_DIR}/data/host-backups:/mnt/host-backups

  web:
    container_name: bubbywoodz-mneme_web_1
    image: ghcr.io/mneme-blog/mneme-web:v0.5.1@sha256:02321d184ea53a96e0ae6dc7abad000d42ffa8bff9d988298c892677db8bf4dd
    restart: on-failure
    depends_on:
      - server
    ports:
      - "8092:80"
    volumes:
      - ${APP_DATA_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
