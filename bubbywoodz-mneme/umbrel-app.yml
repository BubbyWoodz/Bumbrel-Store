manifestVersion: 1.1
id: bubbywoodz-mneme
category: Productivity
name: Mneme
version: "2.0"
releaseNotes: >-
  Mneme is WORKING. Fixed the Garage S3 backend which was crashing on startup:
  the db_engine setting was written as a TOML table instead of a plain string,
  and the s3_web section was missing its required root_domain field. With
  Garage running, the relay's S3 bucket check passes and the API is fully
  live: vault registration, entry sync, and media uploads all work.
  Verified end-to-end with a test vault. Architecture unchanged from upstream
  (Caddy + Go relay + Postgres + Garage); all images digest-pinned. Still
  pre-1.0, no external audit — keep backups on, write down your 12-word
  recovery phrase (no reset exists).
tagline: Local-first, end-to-end encrypted journal
description: >-
  Mneme is a private journal designed so that even the server operator can't
  read your entries: everything is encrypted end-to-end, unlocked by your
  12-word recovery phrase (optional passphrase or FIDO2 security key for
  seed sealing). Write entries with rich text and media, works offline as a
  PWA, syncs through your own relay with automatic encrypted backups.
  WRITE DOWN your 12-word recovery phrase when you create your vault — there
  is no password reset, losing the words means losing the journal. Mneme is
  pre-1.0 and hasn't had an external security audit, so treat it as a
  promising beta for now.
