manifestVersion: 1.1
id: bubbywoodz-mneme
category: Productivity
name: Mneme
version: "1.0.2"
releaseNotes: >-
  Media uploads are back. Replaced MinIO with Garage, an S3-compatible store
  run by Deuxfleurs (a French non-profit focused on decentralization and
  self-hosting): no telemetry, no phone-home, privacy-aligned with Mneme's
  own philosophy. Photos and voice notes now upload to your own server again.
  All credentials remain per-install via Umbrel's APP_SEED. A fallback image
  mirror is kept on GHCR in case Docker Hub ever becomes unavailable. Still
  pre-1.0 with no external audit — promising beta, keep backups on, and
  write down your 12-word recovery phrase (no reset exists).
tagline: Local-first, end-to-end encrypted journal
description: >-
  Mneme is a private journal designed so that even the server operator can't
  read your entries: everything is encrypted end-to-end, unlocked by your
  12-word recovery phrase (optional passphrase or FIDO2 security key for
  seed sealing). Write entries with rich text and media, works offline as a
  PWA, syncs through your own relay with automatic encrypted backups.
  WRITE DOWN your 12-word recovery phrase when you create your vault — there
  is no password reset, losing the words means losing the journal. Mneme is
  pre-1.0 and hasn't had an external security audit, so treat it as a
  promising beta for now.
developer: mneme-blog
website: https://github.com/mneme-blog/mneme
