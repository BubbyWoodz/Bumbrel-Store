manifestVersion: 1.1
id: bubbywoodz-mneme
category: Productivity
name: Mneme
version: "1.0.3"
releaseNotes: >-
  Critical sync fix. Journal entries were not reaching the relay — the web
  frontend proxied API requests to the generic hostname "server", which can
  collide with other apps on the shared Docker network and route to the wrong
  backend (API calls returned 405, entries stayed stuck locally). The proxy
  now targets the relay's unique container hostname, so registration, entry
  sync, and media uploads reach the actual Mneme relay. If your entries were
  stuck "syncing", they should now upload after updating. Garage S3 media
  storage from 1.0.2 is unchanged. Still pre-1.0 with no external audit —
  promising beta, keep backups on, and write down your 12-word recovery
  phrase (no reset exists).
tagline: Local-first, end-to-end encrypted journal
description: >-
  Mneme is a private journal designed so that even the server operator can't
  read your entries: everything is encrypted end-to-end, unlocked by your
  12-word recovery phrase (optional passphrase or FIDO2 security key for
  seed sealing). Write entries with rich text and media, works offline as a
  PWA, syncs through your own relay with automatic encrypted backups.
  WRITE DOWN your 12-word recovery phrase when you create your vault — there
  is no password reset, losing the words means losing the journal. Mneme is
  pre-1.0 and hasn't had an external security audit, so treat it as a
  promising beta for now.
