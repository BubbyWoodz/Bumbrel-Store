manifestVersion: 1.1
id: bubbywoodz-mneme
category: Productivity
name: Mneme
version: "1.0.11"
releaseNotes: >-
  LEGIT FIX for the relay API: renamed the Go relay service from the generic
  'server' to 'mneme-relay'. Ten apps on this Umbrel use 'server' as a
  service name, causing a Docker DNS collision — the Caddy proxy was
  reaching a different app's nginx (1.30.5) instead of Mneme's Go relay,
  hence POST /v1/register returned 405. The unique name guarantees correct
  routing. Architecture unchanged from upstream (Caddy + Go relay + Postgres
  + Garage); only the service name is more specific. All images digest-pinned.
  Still pre-1.0, no external audit — keep backups on, write down your
  12-word recovery phrase (no reset exists).
tagline: Local-first, end-to-end encrypted journal
description: >-
  Mneme is a private journal designed so that even the server operator can't
  read your entries: everything is encrypted end-to-end, unlocked by your
  12-word recovery phrase (optional passphrase or FIDO2 security key for
  seed sealing). Write entries with rich text and media, works offline as a
  PWA, syncs through your own relay with automatic encrypted backups.
  WRITE DOWN your 12-word recovery phrase when you create your vault — there
  is no password reset, losing the words means losing the journal. Mneme is
  pre-1.0 and hasn't had an external security audit, so treat it as a
  promising beta for now.
