manifestVersion: 1.1
id: bubbywoodz-mneme
category: Productivity
name: Mneme
version: "1.0.4"
releaseNotes: >-
  Fixes the relay API routing properly. v1.0.3 tried using the container's
  full name, but Docker DNS only resolves service names — so the proxy got a
  502. The relay service is now renamed from the generic "server" to the
  unique "mneme-relay", which resolves correctly on the Docker network with
  no collision risk from other apps. Registration, entry sync, and media
  uploads now reach the actual Mneme relay. If your entries were stuck
  "syncing", they should now upload after updating. All images remain
  digest-pinned. Still pre-1.0 with no external audit — promising beta,
  keep backups on, and write down your 12-word recovery phrase (no reset
  exists).
tagline: Local-first, end-to-end encrypted journal
description: >-
  Mneme is a private journal designed so that even the server operator can't
  read your entries: everything is encrypted end-to-end, unlocked by your
  12-word recovery phrase (optional passphrase or FIDO2 security key for
  seed sealing). Write entries with rich text and media, works offline as a
  PWA, syncs through your own relay with automatic encrypted backups.
  WRITE DOWN your 12-word recovery phrase when you create your vault — there
  is no password reset, losing the words means losing the journal. Mneme is
  pre-1.0 and hasn't had an external security audit, so treat it as a
  promising beta for now.
