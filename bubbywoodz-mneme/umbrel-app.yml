manifestVersion: 1.1
id: bubbywoodz-mneme
category: Productivity
name: Mneme
version: "1.0.6"
releaseNotes: >-
  Fixes the Caddy routing that broke all relay API access. The nested
  handle_path structure was not matching API routes — /healthz and /v1/*
  fell through to the SPA file server instead of proxying to the Go relay
  (POSTs got 405, health checks returned HTML). The Caddyfile now uses flat
  handle blocks with full /mneme/* paths, so the relay API, health checks,
  and admin routes correctly proxy to the server. The SPA still serves from
  /srv with the /mneme prefix stripped. All images remain digest-pinned.
  Still pre-1.0 with no external audit — promising beta, keep backups on,
  and write down your 12-word recovery phrase (no reset exists).
tagline: Local-first, end-to-end encrypted journal
description: >-
  Mneme is a private journal designed so that even the server operator can't
  read your entries: everything is encrypted end-to-end, unlocked by your
  12-word recovery phrase (optional passphrase or FIDO2 security key for
  seed sealing). Write entries with rich text and media, works offline as a
  PWA, syncs through your own relay with automatic encrypted backups.
  WRITE DOWN your 12-word recovery phrase when you create your vault — there
  is no password reset, losing the words means losing the journal. Mneme is
  pre-1.0 and hasn't had an external security audit, so treat it as a
  promising beta for now.
