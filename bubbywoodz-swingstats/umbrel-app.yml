manifestVersion: 1.1
id: bubbywoodz-swingstats
category: Media
name: SwingStats
version: "1.0.0"
tagline: Swing Music library stats for Homepage
description: >-
  Tiny read-only stats service for Swing Music. Walks your music library,
  counts tracks, albums, and artists, and serves them as JSON at /stats for
  the Homepage customapi widget. The music folder is mounted read-only —
  this service never modifies your files.
