version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bubbywoodz-swingstats_app_1
      APP_PORT: 5001
      PROXY_AUTH_ADD: "false"

  app:
    build: .
    image: ghcr.io/bubbywoodz/swingstats:latest
    container_name: bubbywoodz-swingstats_app_1
    working_dir: /app
    command: python3 swingstats.py
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Music library mounted read-only; the service only counts files.
      - /home/umbrel/umbrel/external/T7/Music/SwingMusic:/music:ro
    restart: on-failure
