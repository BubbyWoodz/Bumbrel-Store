<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b3a"/>
      <stop offset="50%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="pill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="pill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="pill3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="240" fill="url(#bg)"/>
  <rect x="112" y="112" width="800" height="800" rx="180" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4"/>
  <!-- pill 1: top, slanted -->
  <g transform="translate(512, 330) rotate(-18)">
    <rect x="-180" y="-55" width="360" height="110" rx="55" fill="url(#pill1)" opacity="0.95"/>
    <rect x="-180" y="-55" width="180" height="110" rx="55" fill="#ffffff" opacity="0.3"/>
  </g>
  <!-- pill 2: middle, slight slant -->
  <g transform="translate(512, 520) rotate(12)">
    <rect x="-180" y="-55" width="360" height="110" rx="55" fill="url(#pill2)" opacity="0.9"/>
    <rect x="-180" y="-55" width="180" height="110" rx="55" fill="#ffffff" opacity="0.28"/>
  </g>
  <!-- pill 3: bottom, slanted opposite, top-right corner touches pill 2's bottom-right -->
  <g transform="translate(560, 705) rotate(-22)">
    <rect x="-180" y="-55" width="360" height="110" rx="55" fill="url(#pill3)" opacity="0.9"/>
    <rect x="-180" y="-55" width="180" height="110" rx="55" fill="#ffffff" opacity="0.28"/>
  </g>
</svg>
