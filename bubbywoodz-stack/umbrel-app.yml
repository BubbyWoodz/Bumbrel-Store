manifestVersion: 1.1
id: bubbywoodz-stack
category: Health
name: Stack
version: "1.0.1"
releaseNotes: >-
  Replaced all emojis with theme-aware SVG icons throughout the app. Fixed the
  Manage tab navigation. New three-pill app icon.
tagline: Encrypted supplement tracker
description: >-
  Your daily supplement stack, beautifully tracked and fully encrypted. Organize
  supplements into Morning, Afternoon, Evening, or your own custom groups. Log
  with one tap or hit "log all" per group. A streak calendar shows your consistency
  at a glance, and the history page tracks how long you've been on each supplement —
  even ones you've archived. Set reminders per group. Everything is end-to-end
  encrypted with a 12-word recovery code (like Mneme) — the server only ever sees
  ciphertext. Optional device password for quick unlock. Forget the 12 words and
  it's gone; there is no recovery. Liquid-glass UI, dark mode, mobile-first.
