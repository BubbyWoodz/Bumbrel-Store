path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Initial release. Upload a zip of .txt/.md journal entries, get a
  Day One-format zip for Mneme's importer. Dates are parsed from
  filenames (2024-01-15, Jan 15 2024, etc.) with file mtime as fallback.
  Temp files are securely wiped after conversion.
