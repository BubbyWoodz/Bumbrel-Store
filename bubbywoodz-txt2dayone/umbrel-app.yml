id: bubbywoodz-txt2dayone
name: TXT to Day One
category: Utilities
version: "1.0.0"
tagline: Convert TXT journal entries to Day One format for Mneme import
description: >-
  Upload a zip of .txt journal entries and get back a Day One-format zip
  ready for Mneme's Day One importer. Everything runs locally on your
  Umbrel — files are wiped from temp storage after conversion. Nothing
  is sent anywhere.
