name: Mirror Garage image to GHCR (fallback)

# One-time / on-demand mirror of the Garage S3 image from Docker Hub to
# GHCR as a fallback. The Mneme package ships from Docker Hub
# (dxflrs/garage); this mirror only gets used if Docker Hub ever becomes
# unavailable. Re-run manually when bumping the Garage version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Garage version tag to mirror (e.g. v2.4.1)"
        required: true
        default: "v2.4.1"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Mirror to GHCR
        run: |
          crane copy \
            dxflrs/garage:${{ inputs.version }} \
            ghcr.io/bubbywoodz/garage:${{ inputs.version }}
