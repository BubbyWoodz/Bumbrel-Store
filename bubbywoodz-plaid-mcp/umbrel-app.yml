manifestVersion: 1.1
id: bubbywoodz-plaid-mcp
category: Finance
name: Plaid MCP
version: "1.0.1"
releaseNotes: >-
  Fix container crash-loop on startup: pin the MCP Python library to v1
  (v2 removed the fastmcp module this server imports). Image rebuilt with
  the corrected dependency set; no upstream code changes.
tagline: Your bank accounts, readable by your AI
description: >-
  Connects your bank accounts to any MCP-compatible AI (like Poke) without a
  middleman service. You link your bank once through Plaid; the server keeps
  the access tokens encrypted on your Umbrel and serves accounts, balances,
  transaction history, merchants, and spending totals over MCP at /mcp,
  guarded by Google sign-in with an email allowlist (only you). Ask things
  like "what did I spend on food last month?" Read-only: nothing here can move
  money. Note: Plaid itself still sees your transaction data (unavoidable —
  they're the bank aggregator), and whichever AI you connect will see whatever
  it queries.
