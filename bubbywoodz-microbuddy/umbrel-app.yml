manifestVersion: 1.1
id: bubbywoodz-microbuddy
category: Dashboards
name: Micro Buddy
version: "2.0.2"
releaseNotes: >-
  Sales now mirrors the iPhone Sales tab: log today's sales and find a product
  side by side, search results that open the day, and your history as a grid of
  day cards by month. Backgrounds now fill the whole page.
tagline: Micro Center sales dashboard
description: >-
  Your Micro Center sales companion on the big screen. Track tickets, commission,
  base pay, and take-home pay with full breakdowns. Paste in sales reports and watch
  them parse automatically. Keep a journal with @coworker mentions and product links,
  manage goals, check your schedule, and chat with Buddy AI (bring your own model).
  Six themes matching the iOS app, including Win95, Terminal and Modern. Sign in by scanning a QR code with the
  Micro Buddy iOS app — your phone's session becomes the dashboard login. Works
  offline after the first sync; your data stays on your server.
