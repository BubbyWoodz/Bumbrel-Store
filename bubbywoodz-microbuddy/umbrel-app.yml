name: Micro Buddy
version: "2.0.11"
releaseNotes: >-
  2.0.11 catches the dashboard up with the iPhone app (batches 14 to 33).
  New: E-key and Walkie gear checkout on the Schedule day and Day detail, a Store picker in Account (locked when your UKG calendar detects your store),
  the Auto Working With switch in Workday > Schedule with automatic coworkers on each shift, missed shifts you can restore,
  edited UKG shifts that keep the posted time on record and pay on your real hours, and a guard against overlapping shifts.
  Stats now fold product lines into brands (UniFi counts as Ubiquiti), count coworkers from your saved schedule with real overlap hours,
  and leave exchanges out of customers and items. Pay math matches the phone: commission brackets, your default lunch, the second meal on long shifts, and payday showing the period that just closed.
  Sync is safer: if your phone and the dashboard edit at the same time, both edits are merged field by field and the phone wins only where you both changed the same thing.
  Long names and labels now wrap instead of being cut off.
tagline: Micro Center sales dashboard
description: >-
  Your Micro Center sales companion on the big screen. Track tickets, commission,
  base pay, and take-home pay with full breakdowns. Paste in sales reports and watch
  them parse automatically. Keep a journal with @coworker mentions and product links,
  manage goals, check your schedule, and chat with Buddy AI (bring your own model).
  Six themes matching the iOS app, including Win95, Terminal and Modern. Sign in by scanning a QR code with the
  Micro Buddy iOS app — your phone's session becomes the dashboard login. Works
  offline after the first sync; your data stays on your server.
